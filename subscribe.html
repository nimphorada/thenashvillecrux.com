<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribe — The Nashville Crux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <svg class="paper-plane" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M4 8 L44 24 L4 40 L10 24 Z" stroke="#111" stroke-width="1.5" fill="none"/>
          <path d="M10 24 L44 24" stroke="#111" stroke-width="1.5"/>
          <path d="M10 24 L16 36" stroke="#111" stroke-width="1.2"/>
        </svg>
        <p class="header-tagline">sent to your inbox<br>on the 5th of<br>every month</p>
      </div>
      <div class="header-center">
        <h1 class="site-title">The Nashville Crux</h1>
      </div>
      <div class="header-right">
        <div class="hold-logo">
          <svg viewBox="0 0 80 70" fill="none">
            <ellipse cx="26" cy="22" rx="18" ry="14" fill="#7EC8D4" transform="rotate(-15 26 22)"/>
            <ellipse cx="52" cy="18" rx="14" ry="10" fill="#8DBE6E" transform="rotate(10 52 18)"/>
            <ellipse cx="44" cy="42" rx="12" ry="9" fill="#E87D3E" transform="rotate(-5 44 42)"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <ul>
      <li><a href="index.html" class="nav-link">home</a></li>
      <li><a href="newsletter.html" class="nav-link">newsletter</a></li>
      <li><a href="resources.html" class="nav-link">resources</a></li>
      <li><a href="subscribe.html" class="nav-link nav-link--active">subscribe</a></li>
    </ul>
  </nav>

  <main class="page page-simple">
    <div class="card simple-page-card subscribe-card">
      <h2 class="section-heading">subscribe</h2>
      <p>Join the Nashville climbing community. Get events, trip reports, and member spotlights delivered on the 5th of every month.</p>
      <div class="subscribe-form">
        <label for="email-input" class="visually-hidden">Email address</label>
        <input type="email" id="email-input" placeholder="your@email.com" class="email-input" />
        <button type="button" class="btn-subscribe" id="subscribe-btn">subscribe</button>
      </div>
      <p class="subscribe-note" id="subscribe-msg"></p>
    </div>
  </main>

  <footer class="site-footer">
    <a href="index.html" class="footer-logo" aria-label="Home">
      <div class="footer-logo-circle">
        <svg viewBox="0 0 60 60" fill="none">
          <ellipse cx="20" cy="28" rx="12" ry="9" fill="#7EC8D4" transform="rotate(-10 20 28)"/>
          <ellipse cx="38" cy="24" rx="9" ry="7" fill="#8DBE6E" transform="rotate(10 38 24)"/>
          <ellipse cx="34" cy="40" rx="8" ry="6" fill="#E87D3E" transform="rotate(-5 34 40)"/>
        </svg>
      </div>
    </a>
  </footer>
  <script src="script.js"></script>
</body>
</html>
